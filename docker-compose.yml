services:
  stage-bot:
    build: ./python
    env_file: .env
    restart: unless-stopped
    # Discord voice is UDP; Docker's default bridge network can stop it
    # getting through. Host networking uses the server's network directly.
    network_mode: host
    # Gives the bot time to leave the Stage cleanly on "docker compose down".
    stop_grace_period: 15s
    volumes:
      - stage-bot-data:/data

volumes:
  stage-bot-data:
